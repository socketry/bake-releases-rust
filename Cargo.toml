[package]
name = "bake-releases"
version = "0.2.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/socketry/bake-releases-rust"
description = "Reusable releases.md tasks for Bake"
readme = "readme.md"
include = ["src/**", "tests/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["socketry/managers"]

[lib]
name = "bake_releases"

[dependencies]
bake = "0.17.0"
tempfile = "3.27"

[patch.crates-io]
bake-releases = { path = "." }
